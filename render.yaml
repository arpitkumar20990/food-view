services:
  - type: web
    name: food-view-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: food-view-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install
    startCommand: cd frontend && npm run dev -- --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_API_URL
        value: https://food-view-backend.onrender.com
